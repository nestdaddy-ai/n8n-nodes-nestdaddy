name: n8n package scan

# Runs n8n's own checks for community packages against the version published on npm.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Publish']
    types: [completed]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Scan the published package
        run: npx -y @n8n/scan-community-package n8n-nodes-nestdaddy
